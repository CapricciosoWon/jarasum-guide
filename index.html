<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>자라섬 여행 가이드</title>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      background: #111827;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      overflow: hidden;
      height: 100%;
    }
    .app {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, #0f172a 0%, #111827 100%);
    }
    .topbar {
      padding: 10px 14px 8px;
      text-align: center;
      background: rgba(15, 23, 42, 0.92);
      border-bottom: 1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(8px);
    }
    .title {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      line-height: 1.2;
    }
    .subtitle {
      margin-top: 4px;
      font-size: 12px;
      color: #cbd5e1;
    }
    .viewer {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }
    .slides {
      height: 100%;
      display: flex;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .slides::-webkit-scrollbar { display: none; }
    .slide {
      min-width: 100%;
      height: 100%;
      scroll-snap-align: start;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }
    .slide img {
      display: block;
      width: 100%;
      height: auto;
      max-height: calc(100dvh - 116px);
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,.28);
      background: #d6eefb;
    }
    .nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 999px;
      background: rgba(17,24,39,.68);
      color: #fff;
      font-size: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 5;
      cursor: pointer;
      backdrop-filter: blur(6px);
    }
    .prev { left: 8px; }
    .next { right: 8px; }
    .bottombar {
      padding: 8px 14px 12px;
      background: rgba(15, 23, 42, 0.94);
      border-top: 1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(8px);
    }
    .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .counter {
      font-size: 14px;
      font-weight: 700;
    }
    .hint {
      font-size: 12px;
      color: #cbd5e1;
    }
    .dots {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-top: 6px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: rgba(255,255,255,.25);
      transition: .2s ease;
    }
    .dot.active {
      width: 20px;
      background: #60a5fa;
    }

    /* 가로모드에서 이미지가 화면을 최대한 크게 차지하도록 */
    @media (orientation: landscape) {
      .topbar {
        padding: 6px 10px 4px;
      }
      .title { font-size: 15px; }
      .subtitle { display: none; }
      .bottombar {
        padding: 5px 10px 7px;
      }
      .hint { font-size: 11px; }
      .counter { font-size: 12px; }
      .slide {
        padding: 4px 8px;
      }
      .slide img {
        max-height: calc(100dvh - 70px);
        width: auto;
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1 class="title">자라섬 여행 가이드</h1>
      <div class="subtitle">손가락으로 좌우로 넘겨보세요</div>
    </header>

    <main class="viewer">
      <button class="nav prev" type="button" aria-label="이전 페이지">‹</button>

      <div class="slides" id="slides">
        <section class="slide"><img src="page1.jpg" alt="자라섬 여행 안내 1페이지"></section>
        <section class="slide"><img src="page2.jpg" alt="자라섬 여행 안내 2페이지"></section>
        <section class="slide"><img src="page3.jpg" alt="자라섬 여행 안내 3페이지"></section>
        <section class="slide"><img src="page4.jpg" alt="자라섬 여행 안내 4페이지"></section>
      </div>

      <button class="nav next" type="button" aria-label="다음 페이지">›</button>
    </main>

    <footer class="bottombar">
      <div class="meta">
        <div class="counter"><span id="current">1</span> / 4</div>
        <div class="hint">좌우 슬라이드 · 가로모드 권장</div>
      </div>
      <div class="dots">
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>
    </footer>
  </div>

  <script>
    const slides = document.getElementById('slides');
    const dots = Array.from(document.querySelectorAll('.dot'));
    const current = document.getElementById('current');
    const prev = document.querySelector('.prev');
    const next = document.querySelector('.next');
    const total = 4;

    function indexNow() {
      return Math.round(slides.scrollLeft / slides.clientWidth);
    }
    function refresh() {
      const i = indexNow();
      current.textContent = i + 1;
      dots.forEach((d, n) => d.classList.toggle('active', n === i));
      prev.style.opacity = i === 0 ? '.35' : '1';
      next.style.opacity = i === total - 1 ? '.35' : '1';
    }
    function go(i) {
      i = Math.max(0, Math.min(total - 1, i));
      slides.scrollTo({ left: slides.clientWidth * i, behavior: 'smooth' });
    }
    prev.addEventListener('click', () => go(indexNow() - 1));
    next.addEventListener('click', () => go(indexNow() + 1));
    dots.forEach((d, i) => d.addEventListener('click', () => go(i)));

    let t;
    slides.addEventListener('scroll', () => {
      clearTimeout(t);
      t = setTimeout(refresh, 70);
    });
    window.addEventListener('resize', refresh);
    refresh();
  </script>
</body>
</html>
